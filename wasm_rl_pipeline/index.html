<!DOCTYPE html><html><head><title>RL Training Viewer</title><style>body{margin:0;padding:0;overflow:hidden;background:#000;}canvas{display:block;}</style></head><body><canvas id="gameCanvas"></canvas><script>let pipelineModule;let trainingCoordinator;let canvas=document.getElementById("gameCanvas");canvas.width=window.innerWidth;canvas.height=window.innerHeight;let ctx=canvas.getContext("2d");let robot1={x:-100,y:0,vx:0,vy:0,health:100};let robot2={x:100,y:0,vx:0,vy:0,health:100};let step=0;function update(){robot1.x+=robot1.vx*0.1;robot2.x+=robot2.vx*0.1;robot1.vx*=0.98;robot2.vx*=0.98;if(Math.abs(robot1.x-robot2.x)<20){robot1.health-=1;robot2.health-=1;if(robot1.health<=0||robot2.health<=0){robot1.health=100;robot2.health=100;}}step++;}function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#111";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#333";ctx.fillRect(0,canvas.height/2-10,canvas.width,20);ctx.fillStyle="#00a0ff";ctx.beginPath();ctx.arc(canvas.width/2+robot1.x,canvas.height/2+robot1.y,20,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff4040";ctx.beginPath();ctx.arc(canvas.width/2+robot2.x,canvas.height/2+robot2.y,20,0,Math.PI*2);ctx.fill();requestAnimationFrame(()=>{update();render();});}render();</script></body></html>
